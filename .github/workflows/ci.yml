name: Podlink CI

on:
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'android/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v4

      - name: Compile, lint, and assemble release APK
        working-directory: android
        run: ./gradlew compileReleaseKotlin compileDebugUnitTestKotlin lintDebug assembleRelease

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: podlink-release-apk
          path: android/app/build/outputs/apk/release/*.apk
